{% extends 'base.html' %}
{% block title %}Вход — BlogSpace{% endblock %}

{% block head %}
<style>
  .auth-wrap {
    min-height: calc(100vh - 60px);
    display: flex; align-items: center; justify-content: center;
    padding: 2rem;
  }
  .auth-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 2.8rem 2.4rem;
    width: 100%; max-width: 420px;
  }
  .auth-box h1 { font-family: var(--font-head); font-size: 2rem; margin-bottom: .4rem; }
  .auth-box .sub { color: var(--muted); font-size: .9rem; margin-bottom: 2.2rem; }
  .auth-box .sub a { color: var(--accent); }
  .auth-submit { width: 100%; justify-content: center; padding: .8rem; font-size: 1rem; border-radius: 12px; margin-top: .5rem; }

  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 3rem; }
  .pw-toggle {
    position: absolute; right: .9rem; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 1.1rem; padding: 0;
    transition: color .2s;
  }
  .pw-toggle:hover { color: var(--text); }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-box">
    <h1>С возвращением ✦</h1>
    <p class="sub">Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a></p>

    <form method="POST" action="{{ url_for('login') }}">
      <div class="form-group">
        <label>Имя пользователя</label>
        <input type="text" name="username" placeholder="your_username" required autofocus>
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <div class="pw-wrap">
          <input type="password" name="password" id="pw1" placeholder="••••••••" required>
          <button type="button" class="pw-toggle" onclick="togglePw('pw1', this)">👁️</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary auth-submit">Войти</button>
    </form>
  </div>
</div>

<script>
function togglePw(id, btn) {
  const input = document.getElementById(id);
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = '🙈';
  } else {
    input.type = 'password';
    btn.textContent = '👁️';
  }
}
</script>
{% endblock %}
